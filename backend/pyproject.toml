[project]
name = "radar"
version = "0.1.0"
description = "Partner Radar: market intelligence on law-firm partners for recruiters"
authors = [{ name = "adamf", email = "adam.a.french2@gmail.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "argon2-cffi>=23.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.13",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "selectolax>=0.3.27",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.15.7",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["YTT", "S", "B", "A", "C4", "T10", "SIM", "I", "C90", "E", "W", "F", "PGH", "UP", "RUF", "TRY"]
ignore = [
    "E501",   # black owns line length
    "TRY003", # long messages in exceptions are fine here
    "S101",   # asserts are used in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
